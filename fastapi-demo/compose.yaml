services:
  db:
    image: postgres:17
    container_name: fastapi-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastapi_learning
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: learning_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_user -d fastapi_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
